version: "3"

tasks:
  package:
    desc: Regenerate committed host plugin skill copies
    cmds:
      - python3 scripts/sync_plugin_skills.py write

  package:check:
    desc: Verify committed host plugin skill copies
    cmds:
      - python3 scripts/sync_plugin_skills.py check

  test:
    desc: Run behavior tests and package synchronization checks
    deps: [package:check]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m unittest discover -s skills/fireworks-billing/tests -v
      - shellcheck skills/grafana-loki/loki-query.sh
      - bash skills/grafana-loki/tests/test-loki-query.sh

  validate:
    desc: Run all repository validation used by CI
    deps: [test]
    cmds:
      - uv run --with pyyaml scripts/validate_skills.py
      - uv run --with pyyaml scripts/validate_codex_plugin.py
      - uv run --with pyyaml scripts/validate_package_metadata.py
      - claude plugin validate . --strict
      - claude plugin validate plugins/claude/sandipb-agents --strict
      - uv run pre-commit run --all-files

  smoke:writing:
    desc: Run opt-in model-backed writing-skill smoke fixtures
    cmds:
      - python3 scripts/writing_smoke.py {{.CLI_ARGS}}

  test:writing-smoke:
    desc: Run opt-in deterministic writing-smoke harness tests
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    cmds:
      - python3 -m unittest scripts.tests.test_writing_smoke -v
